<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">ONX — Software Developer</title><desc id="desc">Ideas claras. Código con carácter. Aplicaciones web, plataformas de negocio y productos digitales.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080d18"/><stop offset="1" stop-color="#101427"/></linearGradient>
 <linearGradient id="electric" x2="1" y2="1"><stop stop-color="#66f8dc"/><stop offset=".5" stop-color="#75d5ff"/><stop offset="1" stop-color="#a391ff"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#468bc8" stop-opacity=".28"/><stop offset="1" stop-color="#0d1425" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#9db8d1" stroke-opacity=".045"/></pattern>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:Consolas,monospace}
.orbit{transform-origin:961px 224px;animation:orbit 28s linear infinite}.reverse{animation-direction:reverse;animation-duration:38s}
.signal{animation:signal 3s ease-in-out infinite}.flow{stroke-dasharray:150 700;animation:flow 8s linear infinite}
.word{animation:words 12s ease-in-out infinite}.w2{animation-delay:-8s}.w3{animation-delay:-4s}
@keyframes orbit{to{transform:rotate(360deg)}}@keyframes signal{50%{opacity:.35}}
@keyframes flow{to{stroke-dashoffset:-850}}@keyframes words{0%,25%{opacity:1}30%,95%{opacity:0}100%{opacity:1}}
@media(prefers-reduced-motion:reduce){.orbit,.signal,.flow{animation:none}.word{animation:none;opacity:0}.w1{opacity:1}}
</style>
<rect width="1200" height="460" rx="24" fill="url(#bg)"/>
<rect width="1200" height="460" rx="24" fill="url(#grid)"/>
<circle cx="961" cy="224" r="237" fill="url(#halo)"/>
<rect x=".5" y=".5" width="1199" height="459" rx="24" fill="none" stroke="#253449"/>
<path d="M52 76H1148" stroke="#243043"/>
<circle cx="60" cy="43" r="5" fill="#74f8d2" class="signal"/>
<text x="78" y="49" class="mono" font-size="15" fill="#a5b7ce" letter-spacing="2">ONX / SOFTWARE DEVELOPER</text>
<text x="1148" y="49" text-anchor="end" class="mono" font-size="13" fill="#6c7e98">DESIGN. BUILD. REFINE.</text>
<text x="44" y="244" font-size="184" font-weight="900" letter-spacing="-13" fill="#f0f6ff">ONX<tspan fill="#74f8d2">.</tspan></text>
<text x="56" y="299" font-size="32" fill="#e3ecfa" font-weight="600">Ideas claras. Código con carácter.</text>
<text x="57" y="336" font-size="19" fill="#92a5bf">Desarrollo de productos digitales con propósito.</text>
<g fill="none" stroke="url(#electric)">
 <circle cx="961" cy="224" r="151" stroke-opacity=".24"/>
 <circle cx="961" cy="224" r="122" stroke-opacity=".22"/>
 <circle cx="961" cy="224" r="89" stroke-opacity=".16"/>
 <g class="orbit"><ellipse cx="961" cy="224" rx="164" ry="58" transform="rotate(-35 961 224)" stroke-width="2"/><circle cx="1095" cy="143" r="6" fill="#77efdd" stroke="none"/></g>
 <g class="orbit reverse"><ellipse cx="961" cy="224" rx="160" ry="60" transform="rotate(45 961 224)" stroke-opacity=".6"/><circle cx="850" cy="112" r="4" fill="#a99aff" stroke="none"/></g>
 <circle cx="961" cy="224" r="151" class="flow" stroke-width="3"/>
</g>
<path d="M929 204l-23 20 23 20m64-40 23 20-23 20m-24-58-16 76" stroke="#d8f9ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="961" y="414" text-anchor="middle" class="mono" font-size="12" letter-spacing="2" fill="#758ba9">CREATIVE MIND / ENGINEERING FOCUS</text>
<path d="M56 373H1144" stroke="#243043"/>
<text x="57" y="414" class="mono" font-size="17" fill="#74f8d2">&gt;_</text>
<g fill="#b5c8e0" class="mono" font-size="16">
<text x="93" y="414" class="word w1">APLICACIONES WEB</text>
<text x="93" y="414" class="word w2" opacity="0">PLATAFORMAS DE NEGOCIO</text>
<text x="93" y="414" class="word w3" opacity="0">EXPERIENCIAS DIGITALES</text>
</g>
</svg>
