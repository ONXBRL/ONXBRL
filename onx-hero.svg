<style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,monospace}.scan{stroke-dasharray:100 950;animation:scan 8s linear infinite}.spin{transform-origin:1014px 216px;animation:turn 30s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.line{animation:load 6s ease-in-out infinite;transform-origin:48px 380px}.w{animation:words 12s infinite}.w2{animation-delay:-8s}.w3{animation-delay:-4s}@keyframes scan{to{stroke-dashoffset:-1050}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.3}}@keyframes load{0%,100%{transform:scaleX(.25)}50%{transform:scaleX(1)}}@keyframes words{0%,25%{opacity:1}30%,95%{opacity:0}100%{opacity:1}}@media(prefers-reduced-motion:reduce){.scan,.spin,.pulse,.line{animation:none}.w{animation:none;opacity:0}.w1{opacity:1}}</style>
