<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Proyectos de ONX</title><desc id="desc">Bistrio, Telehealth, AxisFX y La Azotea. JavaScript, TypeScript, React, Next.js, Supabase y PostgreSQL.</desc><defs><linearGradient id="card" x2="1" y2="1"><stop stop-color="#101010"/><stop offset="1" stop-color="#0a0a0a"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,monospace}.line{stroke-dasharray:55 560;animation:drift 9s linear infinite}@keyframes drift{to{stroke-dashoffset:-615}}@media(prefers-reduced-motion:reduce){.line{animation:none}}</style><rect width="1200" height="630" rx="2" fill="#080808"/><rect x=".5" y=".5" width="1199" height="629" rx="2" fill="none" stroke="#292929"/><text x="38" y="47" fill="#a0a0a0" class="mono" font-size="14" letter-spacing="3">01 / PROYECTOS</text><text x="1162" y="47" fill="#909090" text-anchor="end" class="mono" font-size="12">PRODUCTOS CON CONTEXTO REAL</text><g transform="translate(28 76)"><rect width="560" height="185" rx="2" fill="url(#card)" stroke="#282828"/><path d="M18 1H542" stroke="#f00e32" stroke-width="1.5" class="line" style="animation-delay:-0s"/><text x="24" y="32" class="mono" fill="#f00e32" font-size="12" letter-spacing="1">OPERACIONES / RESTAURANTES</text><text x="534" y="35" text-anchor="end" class="mono" fill="#555555" font-size="24">01</text><text x="24" y="81" fill="#f6f5f0" font-size="31" font-weight="700" letter-spacing="1">BISTRIO</text><text x="24" y="119" fill="#d0d0d0" font-size="19">Una plataforma. Múltiples restaurantes.</text><text x="24" y="151" fill="#a0a0a0" font-size="17">Cartas digitales, administración y operación.</text></g><g transform="translate(612 76)"><rect width="560" height="185" rx="2" fill="url(#card)" stroke="#282828"/><path d="M18 1H542" stroke="#f00e32" stroke-width="1.5" class="line" style="animation-delay:-2s"/><text x="24" y="32" class="mono" fill="#f00e32" font-size="12" letter-spacing="1">SERVICIOS / SALUD</text><text x="534" y="35" text-anchor="end" class="mono" fill="#555555" font-size="24">02</text><text x="24" y="81" fill="#f6f5f0" font-size="31" font-weight="700" letter-spacing="1">TELEHEALTH</text><text x="24" y="119" fill="#d0d0d0" font-size="19">Tecnología para organizar la atención.</text><text x="24" y="151" fill="#a0a0a0" font-size="17">Plataforma web de gestión clínica.</text></g><g transform="translate(28 281)"><rect width="560" height="185" rx="2" fill="url(#card)" stroke="#282828"/><path d="M18 1H542" stroke="#f00e32" stroke-width="1.5" class="line" style="animation-delay:-4s"/><text x="24" y="32" class="mono" fill="#f00e32" font-size="12" letter-spacing="1">COMERCIO / DISEÑO</text><text x="534" y="35" text-anchor="end" class="mono" fill="#555555" font-size="24">03</text><text x="24" y="81" fill="#f6f5f0" font-size="31" font-weight="700" letter-spacing="1">AXISFX</text><text x="24" y="119" fill="#d0d0d0" font-size="19">De portafolio a experiencia de compra.</text><text x="24" y="151" fill="#a0a0a0" font-size="17">Tienda, pedidos y soporte al cliente.</text></g><g transform="translate(612 281)"><rect width="560" height="185" rx="2" fill="url(#card)" stroke="#282828"/><path d="M18 1H542" stroke="#f00e32" stroke-width="1.5" class="line" style="animation-delay:-6s"/><text x="24" y="32" class="mono" fill="#f00e32" font-size="12" letter-spacing="1">GESTIÓN / RESTAURANTES</text><text x="534" y="35" text-anchor="end" class="mono" fill="#555555" font-size="24">04</text><text x="24" y="81" fill="#f6f5f0" font-size="31" font-weight="700" letter-spacing="1">LA AZOTEA</text><text x="24" y="119" fill="#d0d0d0" font-size="19">Cada área del restaurante, conectada.</text><text x="24" y="151" fill="#a0a0a0" font-size="17">Pedidos, cocina, servicio y caja.</text></g><path d="M38 507H1162" stroke="#292929"/><text x="38" y="547" class="mono" fill="#a0a0a0" font-size="13" letter-spacing="3">02 / TECNOLOGÍAS</text><rect x="38" y="568" width="174" height="34" rx="2" fill="#111111" stroke="#303030"/><circle cx="54" cy="585" r="3" fill="#f00e32"/><text x="68" y="590" font-size="15" fill="#eeeeee">JavaScript</text><rect x="228" y="568" width="174" height="34" rx="2" fill="#111111" stroke="#303030"/><circle cx="244" cy="585" r="3" fill="#f00e32"/><text x="258" y="590" font-size="15" fill="#eeeeee">TypeScript</text><rect x="418" y="568" width="174" height="34" rx="2" fill="#111111" stroke="#303030"/><circle cx="434" cy="585" r="3" fill="#f00e32"/><text x="448" y="590" font-size="15" fill="#eeeeee">React</text><rect x="608" y="568" width="174" height="34" rx="2" fill="#111111" stroke="#303030"/><circle cx="624" cy="585" r="3" fill="#f00e32"/><text x="638" y="590" font-size="15" fill="#eeeeee">Next.js</text><rect x="798" y="568" width="174" height="34" rx="2" fill="#111111" stroke="#303030"/><circle cx="814" cy="585" r="3" fill="#f00e32"/><text x="828" y="590" font-size="15" fill="#eeeeee">Supabase</text><rect x="988" y="568" width="174" height="34" rx="2" fill="#111111" stroke="#303030"/><circle cx="1004" cy="585" r="3" fill="#f00e32"/><text x="1018" y="590" font-size="15" fill="#eeeeee">PostgreSQL</text></svg>
